# Bluetooth address the ONBOARD radio must present.
#
# This is the address of the original Planica Pi Zero. Every camera was paired
# with it, and a GoPro accepts commands only from an address it has paired with
# -- so any replacement Pi must present this, or all 14 cameras refuse it.
#
# Verified 2026-08-31: wiping every bonding key on the host changed nothing,
# while changing this address broke every camera instantly. The address is the
# whole credential; the keys are not consulted.
#
# setup.sh installs this to /etc/bt-clone-addr, and bt-clone-addr.service
# reapplies it on every boot (the Broadcom chip reloads its own address from
# firmware each time, so the change does not stick by itself).
#
# ONLY ONE powered device may use this address at a time. Two radios claiming
# it will make the cameras fail in ways that look random.
B8:27:EB:91:8B:A6
